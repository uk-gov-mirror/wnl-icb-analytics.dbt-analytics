models:
  - name: cltcs_adult_population
    description: >
      C-LTCS complex adult cohort used by cltcs_patient_list and the C-LTCS sub-score
      models. One row per sk_patient_id from dim_person_demographics_basic that maps to
      an OLIDS person_id (latest-registered-record tiebreak), is an active current
      registrant at a practice in the C-LTCS neighbourhood mapping, and turned 18 before the
      start of the current month. A person is excluded as deceased only when OLIDS
      marks them deceased and PDS also records a date of death. People are kept only with
      more than 2 conditions in dim_person_conditions and at least one of: Cambridge comorbidity score above 1.5,
      LTC LCS overall risk group HRC or HR, moderate or severe frailty (eFI2 category or
      frailty register), more than 3 A&E attendances in the last 12 months, or more than
      1 non-elective admission for an ambulatory care sensitive condition in the last 12
      months. fragmented_sk_patient_id_flag and fragmented_person_id_flag mark
      identifiers that map to more than one OLIDS person or patient; the
      sk_patient_id to person_id resolution is a local stopgap (see the model header).
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: sk_patient_id
        data_type: number
        description: "Unique patient identifier (sk_patient_id from PDS via dim_person_demographics_basic)."
        data_tests:
          - unique
          - not_null

      - name: person_id
        description: "OLIDS person key (via dim_person_pseudo, deduped to one per sk_patient_id). Null if unmapped."
        data_tests:
          - unique
          - not_null

      - name: neighbourhood_code
        data_type: varchar
        description: "C-LTCS local neighbourhood code (z-score scaling group). Null for practices outside the Haringey/Camden mapping."

      - name: practice_code
        data_type: varchar
        description: "Registered GP practice ODS code."
