
models:
  - name: fct_person_sus_apc_recent
    description: >
      Recent SUS admitted patient care activity per person over rolling windows ending
      today. One row per patient key (sk_patient_id) in dim_person_demographics_basic, which
      the SQL describes as all people in PDS whether living, dead, registered or not, plus
      any other patient key with qualifying activity; people with no activity have zero
      counts. Spells come from int_sus_apc_imputed_spells, excluding null or '1' patient keys
      and admission methods 2C, 82 and 31; apc_1mo, apc_3mo, apc_12mo and apc_nel_12mo
      (admission method starting 2) count spells starting within the last 1, 3 and 12
      months. apc_los_12mo is non-overlapping length of stay from int_sus_apc_merged_spells,
      acs_nel_12mo counts ambulatory care sensitive non-elective admissions from
      int_activity_ambulatory_sensitive_nel starting in the last 12 months, and the dq_
      columns count spells with a missing source start date, end date or duration among
      spells starting or ending in the last 12 months. Windows do not allow for SUS
      reporting delay, and the model needs expert analyst review.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: sk_patient_id
        data_type: varchar
        description: "Unique identifier for the patient (pseudonymised NHS number)"  
        tests:
          - not_null
          - unique

      - name: apc_3mo
        data_type: number
        description: "Number of inpatient spells attended in the last 3 months"

      - name: apc_1mo
        data_type: number
        description: "Number of inpatient spells attended in the last 1 month"

      - name: apc_12mo
        data_type: number
        description: "Number of inpatient spells attended in the last 12 months"

      - name: apc_los_12mo
        data_type: number
        description: "Total length of stay for inpatient spells in the last 12 months"
      
      - name: apc_nel_12mo
        data_type: number
        description: "Number of inpatient spells attended as non-elective (emergency) in the last 12 months"
