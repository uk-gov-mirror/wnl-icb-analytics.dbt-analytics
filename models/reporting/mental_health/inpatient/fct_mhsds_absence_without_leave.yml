version: 2
models:
- name: fct_mhsds_absence_without_leave
  description: Recorded absence without leave periods, one row per provider, ward stay and leave start
    date/time. Leave types remain separate. These periods do not alter inferred occupancy or establish
    a common bed-day deduction rule. The newest accepted version is selected by reporting period, receipt,
    submission and source row. Missing identity components retain separate source records. These are recorded
    periods/events, not inferred current state.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: absence_without_leave_id
    description: Unique identifier at the documented model grain.
    data_tests:
    - not_null
    - unique
  - name: hospital_provider_spell_source_record_id
    description: Submitted hospital provider spell source record id.
  - name: ward_stay_source_record_id
    description: Submitted ward stay source record id.
  - name: leave_start_date
    description: Submitted leave start date.
  - name: leave_end_date
    description: Submitted leave end date.
  - name: leave_start_time
    description: Submitted leave start time.
  - name: leave_end_time
    description: Submitted leave end time.
  - name: leave_end_reason_code
    description: Submitted leave end reason code.
  - name: leave_end_reason_description
    description: National label, including historical codes; null when no definition matches.
  - name: n_accepted_source_records
    description: Accepted submitted versions of this identity across all periods, including repeats.
  - name: is_identity_incomplete
    description: A required identity component is missing; the source row is retained separately.
  - name: first_submission_period_end_date
    description: First accepted reporting period containing this identity, not the clinical start date.
  - name: reporting_period_end_date
    description: Period of the accepted source evidence; may be later than the clinical event.
  - name: source_file_received_at
    description: Source file receipt timestamp, not a clinical time.
