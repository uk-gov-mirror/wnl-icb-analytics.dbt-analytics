version: 2
models:
- name: fct_mhsds_latest_provider_caseload_referral
  description: 'Latest provider caseload evidence, one open referral in each provider''s latest accepted reporting
    period. Receipt must be on or before period end, with no rejection or discharge by that date. Includes
    referrals with no attended contact and people outside inpatient care. Provider periods can be old. Use
    fct_mhsds_current_caseload_referral for the dataset latest reporting month. Older referrals absent from
    the latest submission are not carried forward or declared discharged. Provider lag and contact recency
    remain visible; no inactivity cut-off is imposed. Join team relationships on submission_id/uniq_submission_id
    and referral_source_record_id, retaining their one-to-many grain. Definition owner: Eddie Davison.'
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: referral_period_id
    description: Unique open referral-period key.
    data_tests:
    - unique
    - not_null
  - name: recorded_caseload_contact_state
    description: No attendance recorded, attended in the latest provider period, or attendance only in an earlier
      period. This does not prove an active treatment plan.
  - name: days_since_last_attended_contact
    description: Calendar days from the latest evidenced attended contact to the provider period end. Null
      when no attendance is evidenced.
  - name: provider_months_behind_dataset
    description: Difference in calendar months from this provider evidence date to the dataset latest period.
      Zero is aligned; larger values show older evidence.
  - name: days_since_referral_received
    description: Calendar days since receipt at the provider evidence date.
