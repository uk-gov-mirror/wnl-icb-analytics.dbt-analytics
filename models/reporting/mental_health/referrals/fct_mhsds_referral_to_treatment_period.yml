version: 2
models:
- name: fct_mhsds_referral_to_treatment_period
  description: Recorded referral-to-treatment clock evidence. One row per accepted MHS104 record in a reporting
    period. Distinguishes the submitted clock, measure type and status from a referral-to-first-contact interval.
    No national target or waiting-list eligibility is assumed.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: referral_to_treatment_period_id
    description: Unique identifier at the documented model grain.
    data_tests:
    - not_null
    - unique
  - name: referral_source_record_id
    description: Submitted referral source record id.
  - name: pathway_issuer_organisation_code
    description: Submitted pathway issuer organisation code.
  - name: waiting_time_measurement_type_code
    description: Submitted waiting time measurement type code.
  - name: rtt_start_date
    description: Submitted rtt start date.
  - name: rtt_end_date
    description: Submitted rtt end date.
  - name: rtt_status_code
    description: Submitted rtt status code.
  - name: waiting_time_measurement_type_description
    description: National label, including historical codes; null when no definition matches.
  - name: reporting_period_end_date
    description: Period of the accepted source evidence; may be later than the clinical event.
  - name: source_file_received_at
    description: Source file receipt timestamp, not a clinical time.
  - name: pathway_issuer_organisation_name
    description: Authoritative organisation name for the corresponding source code; null when the code is missing
      or unmatched.
