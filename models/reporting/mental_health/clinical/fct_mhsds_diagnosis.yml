version: 2
models:
- name: fct_mhsds_diagnosis
  description: Recorded diagnosis evidence, one row per retained previous, provisional, primary or secondary
    diagnosis item from the shared clinical history. Includes undated, unlabelled and unlinked records.
    Repeated complete revision keys are resolved upstream; different codes and people remain distinct.
    This does not establish a clinically current diagnosis.
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: diagnosis_record_id
    description: Unique clinical-item key for the retained diagnosis evidence.
    data_tests:
    - not_null
    - unique
  - name: diagnosis_role
    description: previous_diagnosis, provisional_diagnosis, primary_diagnosis or secondary_diagnosis.
  - name: diagnosis_code
    description: Submitted clinical code, interpreted using the accompanying coding scheme.
  - name: diagnosis_description
    description: Authoritative clinical label where available; null for missing or unmatched evidence.
  - name: diagnosis_recorded_at
    description: Recorded diagnosis time, or previous-diagnosis discussion time for MHS601. Read clinical_time_basis
      and precision; null for undated evidence.
  - name: coding_scheme_description
    description: Authoritative description of the source coding scheme.
  - name: person_id
    description: Person recorded on the diagnosis, never replaced by the referral person.
  - name: accepted_source_record_count
    description: Number of accepted submitted occurrences represented by this retained clinical item.
