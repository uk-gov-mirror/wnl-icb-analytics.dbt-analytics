version: 2
models:
- name: fct_mhsds_current_caseload_person
  description: 'One identifiable person per provider with at least one recorded open referral in the dataset
    latest accepted reporting month. Includes waiting and previously attended referrals, whether inpatient
    or community. Provider populations overlap, so count distinct person_id for a cross-provider headcount.
    This is recorded caseload evidence, not a clinical judgement of active treatment. Missing-person open referrals
    remain in the referral fact. Owner: Eddie Davison.'
  config:
    meta:
      owner:
        name: Eddie Davison
  columns:
  - name: caseload_person_provider_id
    description: Person and provider key.
    data_tests:
    - unique
    - not_null
  - name: evidence_date
    description: Dataset latest accepted reporting month. Providers without evidence in this month are excluded,
      not assumed to have discharged patients.
  - name: n_open_referrals
    description: Open referrals for this person/provider at the evidence date.
  - name: days_since_last_attended_contact
    description: Days since last attended contact on any currently open referral; null when none is evidenced.
