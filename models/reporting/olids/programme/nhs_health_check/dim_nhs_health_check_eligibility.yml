models:
  - name: dim_nhs_health_check_eligibility
    description: >
      NHS Health Check eligibility and due status, one row per person in dim_person with
      an age in dim_person_age. Registration and death are not filtered, and deceased
      people carry their age at death. is_eligible_for_nhs_health_check is true for
      people aged 40 to 74 who are on none of the CHD, diabetes, stroke/TIA, CKD, atrial
      fibrillation, heart failure or familial hypercholesterolaemia registers; everyone
      else remains with the flag false. Hypertension, PAD, statin prescribing and a
      previous 10-year CVD risk of 20% or more are not used as exclusions.
      due_nhs_health_check is true for eligible people with no completed check
      (HEALTH_CHECK_COMP) or whose latest check is more than 1,825 days (5 years) before
      today.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: 'Unique person identifier - primary key'
        tests:
          - unique
          - not_null
