models:
  - name: fct_person_diabetes_triple_target
    description: >-
      Diabetes care targets for current OLIDS diabetes-register members, one row per person. Targets
      are HbA1c at or below 58 mmol/mol, blood pressure below 130/80 mmHg using the local target,
      and total cholesterol below 5 mmol/L. Uses the latest HbA1c and cholesterol measurements, with
      separate 12-month recency flags. BP uses independent context minima on the latest eligible
      day, including invalid-only days. Clinic readings qualify. Home averages take priority over
      self-reported or unspecified home readings on the same date. Daytime or waking ABPM averages
      take priority, followed by unspecified and 24-hour ABPM. Night-time, interval, minimum and
      maximum ABPM codes are excluded before pairing. The local BP target remains below 130/80 mmHg
      in every context. Target achievement does not require recency, and missing values do not meet
      the target.
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    config:
      meta:
        indicator:
          id: "DM_TRIPLE_TARGET"
          type: "MEASURE"
          category: "DIABETES_QUALITY"
          clinical_domain: "Cardiometabolic"
          name_short: "Diabetes Triple Target Achievement"
          description_short: "Diabetes care quality assessment using HbA1c ≤58 mmol/mol, BP <130/80 mmHg, cholesterol <5 mmol/L"
          description_long: >
            Diabetes care quality indicator tracking achievement of three clinical
            targets:
            HbA1c ≤58 mmol/mol for glycaemic control, blood pressure <130/80 mmHg
            for cardiovascular  protection, and total cholesterol <5 mmol/L for cardiovascular
            risk management. Supports  QOF reporting and identifies patients requiring
            intensified management.
          is_qof: false
          source_column: "all_three_targets_met"
          usage_contexts:
            - "DIABETES_CARE_MONITORING"
          code_clusters:
            - cluster_id: "DM_COD"
              category: "INCLUSION"
            - cluster_id: "DMTYPE1_COD"
              category: "INCLUSION"
            - cluster_id: "DMTYPE2_COD"
              category: "INCLUSION"
            - cluster_id: "HBA1C_COD"
              category: "CALCULATION"
            - cluster_id: "BP_COD"
              category: "CALCULATION"
            - cluster_id: "CHOL_COD"
              category: "CALCULATION"
          thresholds:
            # HbA1c Target
            - population_group: "DIABETES"
              threshold_type: "HBA1C_TARGET"
              threshold_value: "58"
              threshold_operator: "AT_OR_BELOW"
              threshold_unit: "mmol/mol"
              description: "QOF HbA1c target for glycaemic control"
              sort_order: 1
            # Blood Pressure Target
            - population_group: "DIABETES"
              threshold_type: "BP_TARGET_SYSTOLIC"
              threshold_value: "130"
              threshold_operator: "BELOW"
              threshold_unit: "mmHg"
              description: "Systolic BP target for diabetes"
              sort_order: 2
            - population_group: "DIABETES"
              threshold_type: "BP_TARGET_DIASTOLIC"
              threshold_value: "80"
              threshold_operator: "BELOW"
              threshold_unit: "mmHg"
              description: "Diastolic BP target for diabetes"
              sort_order: 3
            # Cholesterol Target
            - population_group: "DIABETES"
              threshold_type: "CHOLESTEROL_TARGET"
              threshold_value: "5"
              threshold_operator: "BELOW"
              threshold_unit: "mmol/L"
              description: "Total cholesterol target for cardiovascular risk management"
              sort_order: 4

        owner:
          name: EddieDavison92
    columns:
      - name: person_id
        description: Unique person identifier
        data_tests:
          - unique
          - not_null

      - name: diabetes_type
        description: Diabetes type classification (Type 1, Type 2, Unknown)

      - name: latest_hba1c_date
        description: Date of most recent HbA1c measurement

      - name: latest_hba1c_value
        description: Most recent HbA1c value

      - name: hba1c_unit
        description: Unit for HbA1c measurement (mmol/mol or %)

      - name: hba1c_clinical_category
        description: Clinical category for HbA1c level

      - name: latest_bp_date
        description: Latest eligible control date; null when absent

      - name: latest_systolic
        description: Independent systolic minimum in mmHg within the selected latest-day context; null when absent

      - name: latest_diastolic
        description: Independent diastolic minimum in mmHg within the selected latest-day context; null when absent

      - name: latest_chol_date
        description: Date of most recent cholesterol measurement

      - name: latest_chol_value
        description: Most recent total cholesterol value (mmol/L)

      - name: hba1c_type
        description: HbA1c measurement standard (IFCC or DCCT)

      - name: hba1c_in_target_range
        description: Whether HbA1c meets QOF target (≤58 mmol/mol)

      - name: bp_in_target_range
        description: Whether blood pressure meets target (<130/80 mmHg)

      - name: cholesterol_in_target_range
        description: Whether cholesterol meets target (<5 mmol/L)

      - name: all_three_targets_met
        description: Whether all three targets are achieved
unit_tests:
- name: diabetes_triple_target_eligible_bp_contexts
  model: fct_person_diabetes_triple_target
  given:
  - input: ref('fct_person_diabetes_register')
    format: sql
    rows: SELECT person_id,'Type 2'::VARCHAR AS diabetes_type,TRUE AS is_on_register FROM (SELECT column1::NUMBER AS person_id
      FROM VALUES (-14441),(-14442),(-14443),(-14444),(-14445),(-14446),(-14447),(-14448))
  - input: ref('int_nice_blood_pressure_daily_by_context')
    format: sql
    rows: 'SELECT column1::NUMBER AS person_id,column2::DATE AS reading_date,column3::VARCHAR AS bp_context_group,

      column4::FLOAT AS systolic_value,column5::FLOAT AS diastolic_value,column6::BOOLEAN AS is_valid_bp,

      bp_context_group=''HOME'' AS is_home_bp_event,bp_context_group=''ABPM'' AS is_abpm_bp_event,

      IFF(bp_context_group=''CLINIC'',''CLINIC'',''HBPM_ABPM'') AS applied_measurement_context,

      ''2026-08-03''::TIMESTAMP_NTZ AS date_recorded,''SYN''::VARCHAR AS observation_id

      FROM VALUES (-14441,''2026-08-01'',''CLINIC'',150,95,TRUE),

      (-14442,''2026-08-01'',''CLINIC'',139,89,TRUE),(-14442,''2026-08-01'',''HOME'',136,84,TRUE),

      (-14443,''2026-08-01'',''CLINIC'',135,85,TRUE),(-14443,''2026-08-01'',''HOME'',124,74,TRUE),

      (-14444,''2026-08-01'',''CLINIC'',145,85,TRUE),

      (-14445,''2026-07-01'',''HOME'',120,70,TRUE),(-14445,''2026-08-01'',''CLINIC'',400,250,FALSE),

      (-14447,''2026-08-01'',''HOME'',130,95,TRUE),(-14448,''2026-08-01'',''CLINIC'',129,79,TRUE)'
  - input: ref('int_hba1c_latest')
    format: sql
    rows: SELECT person_id,'2026-08-01'::DATE AS clinical_effective_date,50::FLOAT AS hba1c_original_value,'mmol/mol'::VARCHAR
      AS result_unit_display,'SYNTHETIC'::VARCHAR AS hba1c_category,TRUE AS is_ifcc,FALSE AS is_dcct,TRUE AS meets_qof_target
      FROM (SELECT column1::NUMBER AS person_id FROM VALUES (-14441),(-14442),(-14443),(-14444),(-14445),(-14446),(-14447),(-14448))
  - input: ref('int_cholesterol_latest')
    format: sql
    rows: SELECT person_id,'2026-08-01'::DATE AS clinical_effective_date,4::FLOAT AS cholesterol_value FROM (SELECT column1::NUMBER
      AS person_id FROM VALUES (-14441),(-14442),(-14443),(-14444),(-14445),(-14446),(-14447),(-14448))
  expect:
    rows:
    - person_id: -14441
      bp_in_target_range: false
      all_three_targets_met: false
    - person_id: -14442
      bp_in_target_range: false
      all_three_targets_met: false
    - person_id: -14443
      bp_in_target_range: true
      all_three_targets_met: true
    - person_id: -14444
      bp_in_target_range: false
      all_three_targets_met: false
    - person_id: -14445
      bp_in_target_range: false
      all_three_targets_met: false
    - person_id: -14446
      bp_in_target_range: false
      all_three_targets_met: false
    - person_id: -14447
      bp_in_target_range: false
      all_three_targets_met: false
    - person_id: -14448
      bp_in_target_range: true
      all_three_targets_met: true
