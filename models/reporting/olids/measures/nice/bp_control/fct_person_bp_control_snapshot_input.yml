models:
  - name: fct_person_bp_control_snapshot_input
    description: >-
      Blood pressure control results used to track changes. One row per person with a blood
      pressure reading and an applicable target.


      Records the latest blood pressure pair and whether it meets the applied target. Applied target values are not included. Age
      and time-since-reading fields are omitted so elapsed time alone does not create a new
      history version. Based on NICE NG136.
    config:
      meta:
        owner:
          name: Thomas Shallcross
    columns:
      - name: person_id
        description: "Identifier of the person with a blood pressure recording and an applicable target."
        data_tests:
          - unique
          - not_null
      - name: is_overall_bp_controlled
        description: "Whether both latest blood pressure values are strictly below their applied targets."
      - name: latest_systolic_value
        description: "Independent systolic minimum in mmHg within the selected latest-day context. May come from a different reading to diastolic. Invalid-only dates retain the latest complete reading. Null when absent."
      - name: latest_diastolic_value
        description: "Independent diastolic minimum in mmHg within the selected latest-day context. May come from a different reading to systolic. Invalid-only dates retain the latest complete reading. Null when absent."
      - name: latest_bp_date
        description: "Latest eligible control date through the reporting date; may precede the measurement window. Null when absent."
