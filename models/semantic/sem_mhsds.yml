version: 2
models:
- name: sem_mhsds
  description: MHSDS semantic view over tested reporting entities for people, period demographics, referrals,
    current recorded caseload, contacts, indirect/group activity, circumstances, care plans, assessments, inpatient
    care, capacity, legal restrictions and submission quality. Counts preserve each entity grain. Temporal
    demographic relationships use person/provider/period keys; current person attributes describe current evidence
    only. Anonymous sessions and drop-ins have no person relationship. Score changes remain descriptive and
    capacity is monthly, not live bed availability. Entity counts are reconciled to their reporting facts.
  config:
    materialized: semantic_view
    schema: SEMANTIC
    meta:
      owner:
        name: Eddie Davison
  data_tests:
  - mhsds_semantic_counts
