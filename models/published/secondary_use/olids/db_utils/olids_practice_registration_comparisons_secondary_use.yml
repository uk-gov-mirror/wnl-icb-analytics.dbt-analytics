models:
  - name: pds_olids_reg_pass_secondary_use
    description: >
      Practices that pass the PDS versus OLIDS registration count check. One row per practice
      from int_pds_olids_practice_registration_comparison where meets_acceptance_criteria is
      true: the OLIDS patient count is within 2% of the PDS merged person count, or differs
      by fewer than 5 people. Practices with no PDS count never pass.
      PDS counts are current registrations at open practices with ICB parent code 93C,
      for people with no death record or removal reason, after NHS number merger handling.
      OLIDS counts are current registrations from int_patient_registrations.
      match_quality is 'Excellent Match (<1%)' below 1% difference and 'Meets Criteria'
      otherwise. Use for inner joins to limit analyses to practices with validated
      registration data.
      Counts are practice-level and include all registered patients: no National Data
      Opt-out or Type 1 opt-out filtering is applied, and the output has no patient key.

    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 1
  - name: pds_olids_reg_fail_secondary_use
    description: >
      Practices that fail the PDS versus OLIDS registration count check. One row per practice
      from int_pds_olids_practice_registration_comparison where meets_acceptance_criteria is
      false: the difference is at least 2% and at least 5 people, or the practice has no PDS
      count (zero or missing), which includes OLIDS practices outside the PDS practice list.
      PDS counts are current registrations at open practices with ICB parent code 93C,
      for people with no death record or removal reason, after NHS number merger handling.
      OLIDS counts are current registrations from int_patient_registrations.
      issue_category is '20%+ Variance', '5-20% Variance' or '2-5% Variance' by
      absolute_percent_difference; practices with no PDS count have an
      absolute_percent_difference of 0 and are labelled '2-5% Variance'. These practices
      need investigation before their data is used.
      Counts are practice-level and include all registered patients: no National Data
      Opt-out or Type 1 opt-out filtering is applied, and the output has no patient key.

    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
  - name: pds_olids_reg_comparison_all_secondary_use
    description: |
      Complete PDS registration comparison for all practices with categorisation (Secondary Use).

      Categories: Major Difference (≥20%), Minor Difference (5-20%), Good Match (<5%), No Data
      PDS models support opt-out filtering via sk_patient_id.

      Methodology: PDS All Registration Types Comparison using merged NHS numbers

      Note: EMIS comparisons are NOT available in secondary_use layer as EMIS data
      cannot be joined to opt-out tables (no sk_patient_id).

    config:
      meta:
        owner:
          name: Eddie Davison
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1