models:
  - name: covid_flu_dashboard_base_secondary_use
    description: >
      COVID and flu dashboard base table in the secondary use layer. It is an unfiltered copy
      of covid_flu_dashboard_base: one row per person per campaign per risk group they
      qualify for, for campaigns with a reference date on or before 30 June 2026, with
      demographics, practice, eligibility and vaccination fields and the hx_flake pseudonym
      from person_pseudo. National Data Opt-out and Type 1 opt-out filtering is not applied,
      so people who have opted out are included. The model config meta states that it is
      published under a Section 251 exemption as a HealtheIntent replacement dashboard and is
      approved for that purpose only. See covid_flu_dashboard_base for column definitions.

    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - not_null