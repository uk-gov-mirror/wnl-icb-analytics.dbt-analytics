version: 2



models:

  - name: cltcs_emis_extract

    description: >

      C-LTCS EMIS extract for direct care, one row per sk_patient_id and EMIS usual GP
      practice_code from stg_cltcs_emis, enriched with the PDS registered practice
      (dim_person_demographics_basic) and the OLIDS current practice (dim_person via
      dim_person_pseudo), each with a mismatch flag. For each sk_patient_id, rows whose
      practice_code matches the PDS registered practice are kept when any exist;
      otherwise rows matching the OLIDS current practice are kept when any exist;
      otherwise all rows are kept. A patient can therefore still have more than one row,
      and sk_patient_id uniqueness is tested at warn severity only.

    columns:

      - name: sk_patient_id
        data_type: varchar
        description: Pseudonymised NHS number (surrogate key for patient)
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn

      - name: practice_code
        description: Usual GP organisation code from the EMIS extract
        data_tests:
          - not_null

      - name: pds_registered_practice_code
        description: GP practice_code from dim_person_demographics_basic (PDS registration)

      - name: pds_registered_practice_mismatch_flag
        description: >
          True when practice_code is distinct from registered_practice_code
          (including null vs non-null)
        data_tests:
          - not_null

