models:
  - name: organisation_local_authority
    description: >
      Local authority organisations: ODS organisations with primary role RO141 from
      stg_dictionary_dbo_organisation. One row per organisation_code, keeping the record
      with the latest last_updated date, or first_created where last_updated is missing.
      Closed organisations are retained and have an end_date.
    config:
      meta:
        owner:
          name: Emily Baldwin
    columns:
      - name: organisation_code
        description: Organisation code
        tests:
          - not_null
          - unique
      - name: organisation_name
        description: Organisation name
      - name: sk_organisation_type_id
        description: FK to organisation type
      - name: start_date
        description: Organisation start date
      - name: end_date
        description: Organisation end date (null if active)
      - name: status
        description: Organisation status
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1