
models:
  - name: stg_emis_list_size
    description: |
      EMIS practice list sizes from the emis_list_size seed, one row per
      practice for the seed's extract. Rows with a null EXTRACT_DATE are
      excluded, and EXTRACT_DATE is converted from DD/MM/YYYY text to a date.
      Used as reference data for OLIDS regular registration validation.

      To update: replace the seed with a new EMIS extract and rebuild.

    config:
      meta:
        owner:
          name: Eddie Davison
    columns:
      - name: borough
        description: Borough name (e.g., Barnet, Camden, Enfield, Haringey, 
          Islington)

      - name: practice_code
        description: GP practice ODS code
        tests:
          - unique
          - not_null

      - name: practice_name
        description: GP practice name

      - name: list_size
        description: Number of registered patients according to EMIS extract

      - name: extract_date
        description: Date the EMIS data was extracted, converted from DD/MM/YYYY
          VARCHAR to DATE
