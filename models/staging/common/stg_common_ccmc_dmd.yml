models:
  - name: stg_common_ccmc_dmd
    description: |
      CCMS dm+d codelist from DATA_LAKE__NCL.COMMON.CCMC_DMD.
      Each row maps a CCMS condition to a dm+d product, with the condition name and
      the product's preferred term. Rows are passed through without filtering or
      deduplication. Used by the in-house CCMS pipeline under
      modelling/olids/risk_stratification.
      Migrated from stg_aic_base_ccms_dmd_codes (AIC_DEV.BASE_CCMS_DMD_CODES).
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: conditionid
        description: CCMS condition identifier.
        tests:
          - not_null
      - name: conditionname
        description: CCMS condition name.
      - name: productid
        description: dm+d product code mapped to the condition.
        tests:
          - not_null
      - name: primaryterm
        description: dm+d preferred term for the product.
