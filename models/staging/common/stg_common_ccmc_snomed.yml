models:
  - name: stg_common_ccmc_snomed
    description: |
      CCMS SNOMED codelist from DATA_LAKE__NCL.COMMON.CCMC_SNOMED.
      Each row maps a CCMS condition to a SNOMED CT concept, with the condition name and
      the concept's preferred term. Rows are passed through without filtering or
      deduplication. Used by the in-house CCMS pipeline under
      modelling/olids/risk_stratification.
      Migrated from stg_aic_base_ccms_snomed_codes (AIC_DEV.BASE_CCMS_SNOMED_CODES).
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: conditionid
        description: CCMS condition identifier.
        tests:
          - not_null
      - name: conditionname
        description: CCMS condition name.
      - name: conceptid
        description: SNOMED concept code mapped to the condition.
        tests:
          - not_null
      - name: primaryterm
        description: SNOMED preferred term for the concept.
