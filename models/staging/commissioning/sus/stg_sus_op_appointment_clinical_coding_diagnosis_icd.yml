models:
  - name: stg_sus_op_appointment_clinical_coding_diagnosis_icd
    description: >
      SUS outpatient appointment clinical diagnoses coded in ICD-10, from
      DATA_LAKE.SUS_UNIFIED_OP. One row per diagnosis entry within an
      appointment (primarykey_id and icd_id); diagnosis_id is a surrogate key
      on that pair. Codes are standardised by the clean_icd10_code macro
      (trailing X or dash filler removed, dot after the third character). Where
      the source repeats the same cleaned code for an entry, the row with the
      lowest rownumber_id is kept.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: diagnosis_id
        description: Unique identifier for this diagnosis entry
        tests:
          - not_null
          - unique
      - name: primarykey_id
        description: Primary key from main outpatient appointment (FK)
        tests:
          - not_null
      - name: icd_id
        description: ICD diagnosis identifier within the appointment
        tests:
          - not_null
      - name: rownumber_id
        description: Row number for ordering diagnoses
        tests:
          - not_null
      - name: code
        description: ICD-10 diagnosis code