models:
  - name: stg_sus_ecds_clinical_diagnoses_snomed
    description: >
      SUS ECDS (A&E) clinical diagnoses coded in SNOMED CT, from
      DATA_LAKE.SUS_UNIFIED_ECDS. One row per diagnosis entry within an
      attendance (primarykey_id and snomed_id); diagnosis_id is a surrogate key
      on that pair. Where the source repeats the same code for an entry, the row
      with the lowest rownumber_id is kept. No other filters are applied.
    config:
      meta:
        owner:
          name: Emily Baldwin
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: diagnosis_id
        description: Unique identifier for this diagnosis entry
        tests:
          - not_null
          - unique
      - name: primarykey_id
        description: Primary key from main A&E attendance (FK)
        tests:
          - not_null
      - name: snomed_id
        description: SNOMED identifier within the attendance
        tests:
          - not_null
      - name: rownumber_id
        description: Row number for ordering diagnoses
        tests:
          - not_null
      - name: code
        description: SNOMED CT diagnosis code
      - name: qualifier
        description: "SNOMED qualifier for the diagnosis: 410605003 confirmed present, 415684004 suspected."
