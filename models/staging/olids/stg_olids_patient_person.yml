models:
  - name: stg_olids_patient_person
    description: >
      Links OLIDS patient records to person records. One row per patient_id and
      person_uuid pair; rows with a null patient_id, person_uuid or person_id
      are excluded. Where a pair has several source rows, the row with the
      latest lds_transform_datetime is kept, then the highest
      lds_source_record_id. Rows flagged as deleted are not removed:
      lds_is_deleted is passed through. The source id column is retained but is
      not the model key.
    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: patient_id
        description: Foreign key to patient.id. Part of the natural primary key.
        data_tests:
          - not_null
      - name: person_uuid
        description: Person UUID — part of the natural primary key, distinct from person_id.
        data_tests:
          - not_null
      - name: person_id
        description: Foreign key to person.id.
        data_tests:
          - not_null
      - name: lds_source_record_id
        description: LDS assigned unique identifier for the source record version
      - name: lds_is_deleted
        description: Deletion flag from LDS
      - name: lds_source_record_id_person
        description: "LDS source-record identifier for the linked person (post-2026 OLIDS rename — was lds_record_id_person)"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - patient_id
              - person_uuid
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1