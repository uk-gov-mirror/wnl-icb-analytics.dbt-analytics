models:
  - name: stg_dictionary_ecds_diagnosis
    description: >
      ECDS diagnosis code list from the ECDS Enhanced Technical Output
      Specification (ETOS) reference data (Dictionary.ECDS_ETOS.Diagnosis),
      with ECDS groupings, clinical flags and ICD-10 and ICD-11 mappings. One
      row per ecds_unique_id and valid_from version; where the source repeats
      a version, the row with the latest valid_to is kept, with a null
      valid_to ranked last. Retired entries are kept: use valid_to and
      dv_is_active to select current entries. ICD-10 mappings are standardised
      by the clean_icd10_code macro.
    config:
      meta:
        owner:
          name: Emily Baldwin
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ecds_unique_id
              - valid_from
    columns:
      - name: ecds_unique_id
        description: ECDS unique identifier (part of composite key with valid_from)
        tests:
          - not_null
      - name: snomed_code
        description: SNOMED CT code
        tests:
          - not_null
      - name: icd10_mapping
        description: Mapped ICD-10 code
      - name: icd11_mapping
        description: Mapped ICD-11 code
      - name: valid_from
        description: Valid from date (part of composite key with ecds_unique_id)
        tests:
          - not_null