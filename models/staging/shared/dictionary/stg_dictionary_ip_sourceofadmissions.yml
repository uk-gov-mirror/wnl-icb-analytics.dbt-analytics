models:
  - name: stg_dictionary_ip_sourceofadmissions
    description: >
      Source of admission code list for inpatient hospital provider spells
      (NHS Data Dictionary SOURCE OF ADMISSION CODE (HOSPITAL PROVIDER SPELL)),
      from Dictionary.IP.SourceOfAdmissions. One row per
      sk_source_of_admission_id; where the source has several rows for a key,
      the one with the latest date_updated is kept.
    config:
      meta:
        owner:
          name: Jessica Roberts
    columns:
      - name: sk_source_of_admission_id
        description: Primary key - surrogate key for source of admission
        tests:
          - unique
          - not_null
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1