models:
  - name: stg_pds_address
    description: >
      Personal Demographics Service (PDS) usual address history for
      pseudonymised patients, from DATA_LAKE.PDS.PDS_Address, with postcode
      sector, 2021 LSOA of residence, CQC care home code and business-effective
      dates. For each patient and effective-from date, only rows with the latest
      effective-to date are kept, treating a null effective-to date as
      open-ended. Then one row per patient and event_to_date is kept, choosing
      the highest row_id, so each patient has at most one open-ended (current)
      address.
    config:
      meta:
        owner:
          name: Jake Kealey
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - row_id
              - sk_patient_id
    columns:
      - name: row_id
        description: Row identifier
        tests:
          - not_null
      - name: sk_patient_id
        description: Surrogate key patient identifier (pseudonymised NHS number)
        tests:
          - not_null
      - name: postcode_sector
        description: Postcode sector of residence
      - name: lsoa_21
        description: 2021 LSOA Code of residence