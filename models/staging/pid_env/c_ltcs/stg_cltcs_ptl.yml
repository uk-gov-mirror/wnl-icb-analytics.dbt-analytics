models:
  - name: stg_cltcs_ptl
    description: >
      C-LTCS EMIS patient tracking list (PTL) extract with MDT outcomes, from
      DATA_LAKE__NCL.CLTCS.PTL. One row per source row; rows without an
      sk_patient_id are excluded. sk_patient_id is expected to be unique, but
      duplicates only raise a warning.
    config:
      meta:
        owner:
          name: em-baldwin
    columns:
      - name: sk_patient_id
        data_type: varchar
        description: Pseudonymised NHS number (surrogate key for patient)
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
