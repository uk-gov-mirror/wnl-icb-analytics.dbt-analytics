models:
  - name: stg_cltcs_emis_cltcs_local_mapping_nh_gp
    description: >
      Operational C-LTCS mapping of GP practices to neighbourhoods for the
      Haringey test bed, from DATA_LAKE__NCL.CLTCS.CLTCS_LOCAL_MAPPING_NH_GP.
      One row per practice is expected. Where a practice has several source
      rows, rows whose local_authority matches the last word of
      neighbourhood_registered are kept; if none match, all of that practice's
      rows are kept. No row is chosen arbitrarily: if more than one row remains,
      the unique test on practice_code fails.
    config:
      meta:
        owner:
          name: Emily Baldwin

    columns:
      - name: practice_name
        data_type: varchar
        description: "GP practice name"

      - name: practice_code
        data_type: varchar
        description: "GP practice ODS code"
        tests:
        - unique
        - not_null

      - name: neighbourhood_code
        data_type: varchar
        description: "Neighbourhood code from NCL, remapped to Haringey test bed neighbourhood code"

      - name: neighbourhood_registered
        data_type: varchar
        description: "Neighbourhood registered name from NCL"

      - name: local_authority
        data_type: varchar
        description: "Local authority from NCL"
