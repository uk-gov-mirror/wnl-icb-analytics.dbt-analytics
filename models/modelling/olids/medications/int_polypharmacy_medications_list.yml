
models:
  - name: int_polypharmacy_medications_list
    description: |
      SNOMED products in the NHSBSA polypharmacy chapter scope, one row per product.
      Includes BNF chapters 01 to 04 and 06 to 10, with at least nine BNF characters.
      Where a product has several mappings, the lowest BNF code then name is used.
      The first nine BNF characters identify the chemical counted by consumers.
      Fixed combinations count as one chemical code, without splitting ingredients.
      This replaces the local exclusions formerly held in bnf_polypharmacy_exclusions.

    config:
      meta:
        owner:
          name: EddieDavison92
    columns:
      - name: snomed_code
        description: SNOMED CT code for the medication
        data_tests:
          - not_null
          - unique

      - name: bnf_code
        description: BNF code for the medication
        data_tests:
          - not_null

      - name: bnf_chapter
        description: First two BNF characters. Only chapters 01 to 04 and 06 to 10 are included.
        data_tests:
          - accepted_values:
              arguments:
                values: ['01', '02', '03', '04', '06', '07', '08', '09', '10']
          - not_null

      - name: bnf_name
        description: BNF name/description of the medication
    tests:
      - dbt_utils.at_least_one:
          column_name: snomed_code
