models:
  - name: int_foot_examination_latest
    description: >-
      Last recorded diabetic foot examination date per person, with all statuses
      combined at that date by int_foot_examination_all. Includes incomplete, declined
      and unsuitable examinations. One row per person with evidence, including inactive
      and deceased people. The input has one row per person and clinical date.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - unique
          - not_null