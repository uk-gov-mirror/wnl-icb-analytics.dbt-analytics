models:
  - name: int_urine_acr_all
    description: >
      Urine albumin testing observations, one row per observation, from the PCD
      cluster NDAALB_COD used by the National Diabetes Audit urine albumin care
      process. Rows are kept without a numeric result so a recorded test can be
      counted. albumin_test_type separates ACR, PCR, urine albumin concentration,
      timed albumin excretion and albuminuria findings; two cluster members that
      are not albumin tests are OTHER. ACR values in mg/mmol and their categories
      are populated only for ACR observations with a result between 0 and
      9999.99; other results remain in original_result_value. Historical ACR
      results labelled percent are accepted on the mg/mmol scale as mislabelled
      ratios, without conversion. The source unit label is retained for audit.
    config:
      meta:
        owner:
          name: EddieDavison92
        clinical_source: https://digital.nhs.uk/data-and-information/publications/statistical/national-diabetes-audit
    data_tests:
      - cluster_ids_exist:
          arguments:
            cluster_ids: NDAALB_COD
            source: PCD
    columns:
      - name: id
        description: Observation identifier.
        tests:
          - unique
          - not_null
      - name: person_id
        description: Person identifier.
      - name: clinical_effective_date
        description: Date of the observation.
      - name: concept_code
        description: SNOMED code of the observation.
      - name: concept_display
        description: Description of the observation.
      - name: source_cluster_id
        description: Always NDAALB_COD.
      - name: albumin_test_type
        description: ACR, PCR, URINE_ALBUMIN, TIMED_ALBUMIN, ALBUMINURIA_FINDING or OTHER, by concept code.
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACR', 'PCR', 'URINE_ALBUMIN', 'TIMED_ALBUMIN', 'ALBUMINURIA_FINDING', 'OTHER']
      - name: is_acr_ratio
        description: Whether the observation is an albumin:creatinine ratio.
      - name: is_result_recorded
        description: Whether a numeric result was recorded.
      - name: original_result_value
        description: Result as received, any test type.
      - name: result_unit_display
        description: Unit label as received; null when not supplied.
      - name: acr_value
        description: ACR in mg/mmol. Null for non-ACR observations, missing results and results outside 0 to 9999.99.
      - name: is_valid_acr
        description: Whether acr_value is populated. Kept for existing consumers; it carries no meaning beyond acr_value being non-null.
      - name: acr_category
        description: NICE NG203 albuminuria category (mg/mmol), A1 below 3, A2 3-30 inclusive, A3 above 30; Invalid for out-of-range ACR, null otherwise.
        data_tests:
          - accepted_values:
              arguments:
                values: ['A1 normal to mildly increased (<3)', 'A2 moderately increased (3-30)', 'A3 severely increased (>30)', 'Invalid']
      - name: is_acr_elevated
        description: ACR at or above 3 mg/mmol. False when no valid ACR value.
      - name: is_microalbuminuria
        description: ACR from 3 to 30 mg/mmol inclusive (A2). False when no valid ACR value.
      - name: is_macroalbuminuria
        description: ACR above 30 mg/mmol (A3). False when no valid ACR value.

unit_tests:
- name: acr_nice_categories
  model: int_urine_acr_all
  overrides:
    macros:
      get_observations: |-
        SELECT column1::VARCHAR id, column2::NUMBER person_id,
        column3::TIMESTAMP_NTZ clinical_effective_date, column3::TIMESTAMP_NTZ date_recorded,
        column4::VARCHAR result_value, column5::VARCHAR result_unit_code,
        column5::VARCHAR result_unit_display, '1023491000000104'::VARCHAR mapped_concept_code,
        'Synthetic observation'::VARCHAR mapped_concept_display, column6::VARCHAR cluster_id
        FROM VALUES ('SYN_0', -9300, '2026-01-01', 2.9, 'mg/mmol', 'NDAALB_COD'),
        ('SYN_1', -9301, '2026-01-01', 3, 'mg/mmol', 'NDAALB_COD'),
        ('SYN_2', -9302, '2026-01-01', 30, 'mg/mmol', 'NDAALB_COD'),
        ('SYN_3', -9303, '2026-01-01', 30.1, 'mg/mmol', 'NDAALB_COD'),
        ('SYN_4', -9304, '2026-01-01', 350, 'mg/mmol', 'NDAALB_COD'),
        ('SYN_5', -9305, '2026-01-01', 10000, 'mg/mmol', 'NDAALB_COD')
  given: []
  expect:
    rows:
    - id: SYN_0
      acr_category: A1 normal to mildly increased (<3)
      is_microalbuminuria: false
      is_macroalbuminuria: false
    - id: SYN_1
      acr_category: A2 moderately increased (3-30)
      is_microalbuminuria: true
      is_macroalbuminuria: false
    - id: SYN_2
      acr_category: A2 moderately increased (3-30)
      is_microalbuminuria: true
      is_macroalbuminuria: false
    - id: SYN_3
      acr_category: A3 severely increased (>30)
      is_microalbuminuria: false
      is_macroalbuminuria: true
    - id: SYN_4
      acr_category: A3 severely increased (>30)
      is_microalbuminuria: false
      is_macroalbuminuria: true
    - id: SYN_5
      acr_category: Invalid
      is_microalbuminuria: false
      is_macroalbuminuria: false
