models:
  - name: int_nutrition_review
    description: >
      OLIDS nutrition and diet observations built for the SMI Longer Lives campaign, from the
      SMI_LONGER_LIVES_NUTRITION_ACTIVITY, NUTRIASS_COD and NUTRIASSDEC_COD (declined)
      clusters. One row per person, concept code and clinical date; where duplicates exist
      one row is kept arbitrarily, so source_cluster_id may name any matching cluster.
      Observations dated after today are excluded; get_observations sets a missing clinical
      date to 1900-01-01, so those rows are kept. poor_diet_flag is 'Yes' or 'No' for listed
      diet concept codes, 'Declined' for NUTRIASSDEC_COD rows and null otherwise.

    config:
      meta:
        owner:
          name: KateHomer55
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: person_id
        tests:
          - not_null
