models:
- name: int_weight_mgmt_intervention
  description: Weight-management and exercise activity in OLIDS GP records. One row per person, concept
    and clinical timestamp up to the build date, including inactive and deceased people. Classifies completed
    activity, advice, actual referrals and declines in the existing four lists; offers alone have no positive
    outcome. Diet and exercise fields require wording about that subject. Generic weight-management activity
    has an overall outcome without asserting diet or exercise.
  config:
    meta:
      owner:
        name: KateHomer55
  data_tests:
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 1
  - cluster_ids_exist:
      arguments:
        cluster_ids: SMI_LONGER_LIVES_WEIGHT_MANAGEMENT, EXERCISEINT_COD, WTMGINT_COD, WTMGINTDEC_COD
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - person_id
        - concept_code
        - clinical_effective_date
  columns:
  - name: person_id
    tests:
    - not_null
  - name: id
    description: Retained observation identifier, used after save time to break ties.
  - name: date_recorded
    description: Real source save time, used after clinical date and clinical priority to break ties.
  - name: intervention_outcome
    description: Yes for completed activity, advice or actual referral; Declined for refusal. Null for
      offers or unsupported activity. Generic weight-management records have this overall outcome even
      without diet or exercise wording.
  - name: evidence_type
    description: Shared SNOMED activity evidence type.
