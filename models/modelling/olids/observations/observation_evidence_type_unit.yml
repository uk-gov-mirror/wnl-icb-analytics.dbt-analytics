      concept_name: Synthetic review (procedure)
      evidence_type: completed
      is_offer: false
    - snomed_code: SYN_ADMIN
      concept_name: Synthetic invitation (procedure)
      evidence_type: administrative
      is_offer: false
    - snomed_code: SYN_ADVICE
      concept_name: Synthetic advice (procedure)
      evidence_type: advised
