unit_tests:
- name: dietary_review_requires_review_assessment_or_attendance
  model: int_diabetes_dietary_reviews_all
  given:
  - input: ref('stg_olids_observation')
    format: sql
    rows: 'select column1::number as id, column2::number as person_id, column3::varchar as mapped_concept_code,
      column4::timestamp_ntz as clinical_effective_date, column5::timestamp_ntz as date_recorded,

      null::varchar as patient_id, null::varchar as result_value, null::varchar as result_units_source_concept_id,
      null::varchar as result_unit_code, null::varchar as result_unit_display, null::varchar as result_text, null::varchar
      as allergy_medication_name, null::varchar as is_problem, null::varchar as is_review, null::varchar as problem_end_date,
      null::varchar as mapped_concept_id, null::varchar as mapped_concept_display, null::varchar as episodicity_source_concept_id,
      null::varchar as age_at_event, null::varchar as lds_transform_datetime

      from values (-510, -510, ''SYN_DIET'', ''2026-09-01'', ''2026-09-02 12:00:00''),

      (-511, -511, ''SYN_FIND'', ''2026-09-01'', ''2026-09-02 12:00:00''),

      (-512, -512, ''SYN_TOOL'', ''2026-09-01'', ''2026-09-02 12:00:00''),

      (-513, -513, ''SYN_SEEN'', ''2026-09-01'', ''2026-09-02 12:00:00''),

      (-514, -514, ''SYN_ASSESS'', ''2026-09-01'', ''2026-09-02 12:00:00''),

      (-515, -515, ''SYN_ADVICE'', ''2026-09-01'', ''2026-09-02 12:00:00'')'
  - input: ref('stg_reference_combined_codesets')
    rows:
    - code: SYN_DIET
      cluster_id: DM_DIET_REVIEW_COD
      source: ECL_CACHE
      cluster_description: Synthetic list
      code_description: SYN_DIET
    - code: SYN_DIET
      cluster_id: NUTRIASS_COD
      source: PCD
      cluster_description: Synthetic list
      code_description: SYN_DIET
    - code: SYN_FIND
      cluster_id: NUTRIASS_COD
      source: PCD
      cluster_description: Synthetic list
      code_description: SYN_FIND
    - code: SYN_TOOL
      cluster_id: NUTRIASS_COD
      source: PCD
      cluster_description: Synthetic list
      code_description: SYN_TOOL
    - code: SYN_SEEN
      cluster_id: NHSD_PRIMARY_CARE_DOMAIN_REFSETS/DIETITIAN_COD
      source: OPENCODELISTS
      cluster_description: Synthetic list
      code_description: SYN_SEEN
    - code: SYN_ASSESS
      cluster_id: NUTRIASS_COD
      source: PCD
      cluster_description: Synthetic list
      code_description: SYN_ASSESS
    - code: SYN_ADVICE
      cluster_id: DM_DIET_REVIEW_COD
      source: ECL_CACHE
      cluster_description: Synthetic list
      code_description: SYN_ADVICE
  - input: ref('snomed_evidence_type')
    rows:
    - snomed_code: SYN_DIET
      concept_name: Diabetic dietary review (regime/therapy)
      evidence_type: completed
      is_offer: false
    - snomed_code: SYN_FIND
      concept_name: Low fat diet (finding)
      evidence_type: finding
      is_offer: false
    - snomed_code: SYN_TOOL
      concept_name: Assessment using appetite Questionnaire (procedure)
      evidence_type: completed
      is_offer: false
    - snomed_code: SYN_SEEN
      concept_name: Seen by dietitian (finding)
      evidence_type: completed
      is_offer: false
    - snomed_code: SYN_ASSESS
      concept_name: Nutritional assessment (procedure)
      evidence_type: completed
      is_offer: false
    - snomed_code: SYN_ADVICE
      concept_name: Dietary advice (procedure)
      evidence_type: advised
      is_offer: false
  overrides:
    macros:
      get_empty_subquery_sql: select null::number as id, null::varchar as concept_code, null::varchar as source_cluster_id
        where false
  expect:
    rows:
    - id: -510
      concept_code: SYN_DIET
      source_cluster_id: DM_DIET_REVIEW_COD
    - id: -513
      concept_code: SYN_SEEN
      source_cluster_id: NHSD_PRIMARY_CARE_DOMAIN_REFSETS/DIETITIAN_COD
    - id: -514
      concept_code: SYN_ASSESS
      source_cluster_id: NUTRIASS_COD
