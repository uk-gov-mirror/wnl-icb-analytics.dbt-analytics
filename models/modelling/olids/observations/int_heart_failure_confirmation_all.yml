models:
- name: int_heart_failure_confirmation_all
  description: >-
    Heart-failure confirmation-list evidence, one row per ECOG_COD observation for all people.
    Retains requests, awaited imaging and referrals for the QOF-aligned headline. The completed
    flag selects imaging procedures and results only. The list has no completed specialist
    attendance codes. A specialist route needs a local clinical decision; heart failure clinic
    attendance alone (<<416717003) is the narrow option if wanted. Attendance does not
    establish completed diagnostic assessment. NT-proBNP is not
    confirmation. Consumers apply diagnosis-relative windows.
  config:
    meta:
      owner:
        name: EddieDavison92
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id
  - cluster_ids_exist:
      arguments:
        cluster_ids: ECOG_COD
        source: PCD
  columns:
  - name: evidence_type
    description: Shared SNOMED activity meaning, distinguishing imaging and results from requests or referrals.
  - name: is_completed_confirmation
    description: >-
      True for completed imaging or a recorded imaging result within ECOG_COD. A result
      establishes investigation completion, not that heart failure is confirmed clinically.
      False does not prove that an assessment never took place. Specialist attendance is
      excluded. A local clinical decision is needed before adding an attendance route.
