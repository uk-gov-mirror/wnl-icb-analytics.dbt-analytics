models:
  - name: int_person_ndoo_status
    description: >
      Latest National Data Opt-out preference per person. One row per person_id and
      preference_type, covering people with a latest record (is_latest) in
      stg_olids_national_data_opt_out; people with no opt-out record are absent. Records
      are linked to person_id through stg_olids_patient on sk_patient_id, and records that
      do not resolve to a person are dropped. Where more than one latest record remains,
      the one with the latest effective_from, then effective_to, then lds_record_id is
      kept. is_opted_in is TRUE only for status OPT_IN; OPT_OUT and UNKNOWN give FALSE.
    config:
      meta:
        owner:
          name: EddieDavison92
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - preference_type
    columns:
      - name: person_id
        description: Person identifier from stg_olids_patient, matched on sk_patient_id
        tests:
          - not_null
      - name: preference_type
        description: Normalised preference type (e.g. NATIONAL_DATA_OPT_OUT)
        tests:
          - not_null
      - name: preference_status
        description: Normalised preference status (e.g. OPT_IN, OPT_OUT)
        tests:
          - not_null
      - name: is_opted_in
        description: TRUE when preference_status = 'OPT_IN'
        tests:
          - not_null
      - name: effective_from
        description: Validity start of the latest preference record
      - name: effective_to
        description: Validity end of the latest preference record
