models:
  - name: int_patient_deceased_status
    description: >
      Deceased status and approximate death date for each OLIDS patient record. One row per
      patient_id in stg_olids_patient, including patients with no death record. Deaths are
      combined from OLIDS death month and year (shared across all patient records with the
      same sk_patient_id), PDS (stg_pds_person) and the registry deaths feed
      (stg_registries_deaths). final_date_of_death takes the registry date first, then the
      PDS date, then the OLIDS date approximated to the midpoint of the death month;
      death_date_approx rounds final_date_of_death to the midpoint of its month. An OLIDS
      death with a year but no month gets no approximate date and does not set is_deceased;
      there is no July 1st fallback.

    config:
      meta:
        owner:
          name: EddieDavison92

    columns:
      - name: patient_id
        description: Patient identifier
        tests:
          - not_null
          - unique
      - name: sk_patient_id
        description: Person identifier
      - name: is_deceased
        description: >
          TRUE when a PDS date of death, a registry date of death or an OLIDS
          month-level approximate death date exists.
      - name: death_source_flag
        description: > 
          Sources holding a death record for the patient: 'OLIDS', 'PDS Informal',
          'PDS Formal', 'Registry', 'PDS OLIDS', 'PDS Registry', 'Registry OLIDS' or
          'PDS Registry OLIDS'. NULL when not deceased, or when PDS is the only source
          and its death status is not 1 or 2.
      - name: death_month
        description: Month of death (NULL if alive or unknown) from all sources combined.
      - name: death_year
        description: Year of death (NULL if alive) from all sources combined.
      - name: death_date_approx
        description: >
          Midpoint of the month of final_date_of_death. NULL when final_date_of_death
          is NULL.
      - name: olids_death_date_approx
        description: >
          Approximate death date from OLIDS: midpoint of the recorded death month.
          NULL when OLIDS has no death month, including year-only deaths.
      - name: pds_death_status
        description: Death status from PDS (NULL if alive) 1 Informal, 2 Formal
      - name: pds_date_of_death
        description: Date of death from PDS (NULL if alive)
      - name: reg_date_of_death
        description: Date of death from registry feed (NULL if alive)
      - name: final_date_of_death
        description: > 
          Date of death chosen across sources: the registry date where present,
          otherwise the PDS date, otherwise the OLIDS approximate date.
     